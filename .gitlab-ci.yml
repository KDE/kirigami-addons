include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml
      #- /gitlab-templates/windows-static.yml
      - /gitlab-templates/linux-qt6.yml
      - /gitlab-templates/linux-qt6-static.yml
      - /gitlab-templates/freebsd-qt6.yml
      - /gitlab-templates/android-qt6.yml
      - /gitlab-templates/windows-qt6.yml
      - /gitlab-templates/linux-qt6-next.yml

qml-check-i18n:
  stage: build
  image: invent-registry.kde.org/sysadmin/ci-images/suse-qt611:latest
  needs: []
  rules:
    - changes:
      - "**/*.qml"
      - ".gitlab-ci.yml"
  tags:
    - Linux
  script:
    - |
      python3 - <<'PYTHON'
      import pathlib
      import re
      import sys

      # Ignore comments and quoted strings, retaining line numbers for diagnostics.
      ignored = re.compile(r"/\*.*?\*/|//[^\n]*|\"(?:\\.|[^\"\\])*\"|'(?:\\.|[^'\\])*'", re.S)
      calls = re.compile(r"(?<![\w.])(?:KI18n\.)?x?i18nd?c?p?\s*\(")
      failed = False
      for path in sorted(pathlib.Path("src").rglob("*.qml")):
          source = ignored.sub(lambda match: re.sub(r"[^\n]", " ", match[0]), path.read_text())
          for match in calls.finditer(source):
              line = source.count("\n", 0, match.start()) + 1
              print(f"{path}:{line}: use the private I18n singleton for library translations")
              failed = True
      sys.exit(failed)
      PYTHON

  after_script:
   - >
     if [ $CI_JOB_STATUS != 'success' ]; then
         git --no-pager diff
     fi
